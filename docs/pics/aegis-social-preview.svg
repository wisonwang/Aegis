<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" font-family="'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#141a33"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#818cf8"/>
      <stop offset="1" stop-color="#6366f1"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#6366f1" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1280" height="640" fill="url(#bg)"/>
  <circle cx="1040" cy="180" r="280" fill="url(#glow)"/>

  <!-- Shield / key mark -->
  <g transform="translate(96,150)">
    <path d="M0 30 L60 0 L120 30 L120 96 Q120 168 60 198 Q0 168 0 96 Z" fill="url(#accent)" opacity="0.92"/>
    <circle cx="60" cy="86" r="26" fill="#0b1020"/>
    <rect x="54" y="86" width="12" height="42" rx="6" fill="#0b1020"/>
    <rect x="78" y="112" width="22" height="11" rx="5" fill="#0b1020"/>
    <rect x="78" y="130" width="16" height="11" rx="5" fill="#0b1020"/>
  </g>

  <!-- Title -->
  <text x="280" y="232" font-size="92" font-weight="800" fill="#f8fafc" letter-spacing="2">Aegis</text>
  <text x="284" y="288" font-size="30" font-weight="600" fill="#a5b4fc" letter-spacing="1">AI Data Supply Gateway</text>

  <!-- Tagline -->
  <text x="284" y="356" font-size="34" font-weight="600" fill="#e2e8f0">把内部库，变成受控的 Agent 工具</text>
  <text x="284" y="404" font-size="22" fill="#94a3b8">自托管 · 治理默认开启 · LLM 生成的 SQL 也绕不过权限</text>

  <!-- Mini architecture strip -->
  <g transform="translate(284,452)" font-size="20" font-weight="600">
    <rect x="0" y="0" width="180" height="56" rx="12" fill="#1e293b" stroke="#334155"/>
    <text x="90" y="35" fill="#e2e8f0" text-anchor="middle">App / AI Agent</text>
    <text x="200" y="35" fill="#6366f1" text-anchor="middle" font-size="26">→</text>
    <rect x="232" y="0" width="200" height="56" rx="12" fill="url(#accent)"/>
    <text x="332" y="35" fill="#0b1020" text-anchor="middle">Aegis 网关</text>
    <text x="452" y="35" fill="#6366f1" text-anchor="middle" font-size="26">→</text>
    <rect x="484" y="0" width="200" height="56" rx="12" fill="#1e293b" stroke="#334155"/>
    <text x="584" y="35" fill="#e2e8f0" text-anchor="middle">MySQL / PG</text>
  </g>

  <!-- governance badges -->
  <g transform="translate(284,540)" font-size="18" fill="#cbd5e1">
    <rect x="0" y="0" width="150" height="40" rx="20" fill="#1e293b" stroke="#334155"/>
    <text x="75" y="26" text-anchor="middle">表/行/列治理</text>
    <rect x="166" y="0" width="120" height="40" rx="20" fill="#1e293b" stroke="#334155"/>
    <text x="226" y="26" text-anchor="middle">动态脱敏</text>
    <rect x="302" y="0" width="110" height="40" rx="20" fill="#1e293b" stroke="#334155"/>
    <text x="357" y="26" text-anchor="middle">全量审计</text>
    <rect x="428" y="0" width="150" height="40" rx="20" fill="#1e293b" stroke="#334155"/>
    <text x="503" y="26" text-anchor="middle">DataAPI + MCP</text>
  </g>

  <text x="1196" y="608" font-size="18" fill="#475569" text-anchor="end">github.com/wisonwang/aegis · MIT</text>
</svg>
