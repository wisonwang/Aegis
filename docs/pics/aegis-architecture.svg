<svg viewbox="0 0 980 640" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system,&#39;PingFang SC&#39;,sans-serif">
        <!-- 接入方 -->
        <rect x="60" y="20" width="400" height="80" rx="12" fill="#eff6ff" stroke="#bfdbfe"></rect>
        <text x="260" y="48" text-anchor="middle" font-size="15" font-weight="600" fill="#1d4ed8">业务应用 / 数据产品</text>
        <text x="260" y="74" text-anchor="middle" font-size="12.5" fill="#3b5f8a">REST + JWT（登录签发，含 roles / attrs）</text>
        <rect x="520" y="20" width="400" height="80" rx="12" fill="#faf5ff" stroke="#e9d5ff"></rect>
        <text x="720" y="48" text-anchor="middle" font-size="15" font-weight="600" fill="#7e22ce">AI Agent（ChatBI / 工作流 / Copilot）</text>
        <text x="720" y="74" text-anchor="middle" font-size="12.5" fill="#6b4a8f">MCP Streamable HTTP · API Key / Bearer</text>
        <line x1="260" y1="100" x2="260" y2="132" stroke="#94a3b8" stroke-width="2" marker-end="url(#ar)"></line>
        <line x1="720" y1="100" x2="720" y2="132" stroke="#94a3b8" stroke-width="2" marker-end="url(#ar)"></line>
        <defs><marker id="ar" markerwidth="8" markerheight="8" refx="6" refy="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#94a3b8"></path></marker></defs>
        <!-- API 层 -->
        <rect x="60" y="136" width="860" height="72" rx="12" fill="#ffffff" stroke="#e5e7eb"></rect>
        <text x="90" y="166" font-size="14" font-weight="600" fill="#1f2937">接入 / API 层</text>
        <rect x="240" y="150" width="240" height="44" rx="8" fill="#eef3fb" stroke="#d7e3f4"></rect>
        <text x="360" y="177" text-anchor="middle" font-size="13" fill="#185FA5">DataAPI · /api/v1/query 等</text>
        <rect x="520" y="150" width="270" height="44" rx="8" fill="#f3ecfd" stroke="#ddd0f5"></rect>
        <text x="655" y="177" text-anchor="middle" font-size="13" fill="#534AB7">MCP · list / describe / query 工具</text>
        <line x1="490" y1="208" x2="490" y2="240" stroke="#94a3b8" stroke-width="2" marker-end="url(#ar)"></line>
        <!-- 治理层 -->
        <rect x="60" y="244" width="860" height="120" rx="12" fill="#fffaf0" stroke="#f3d9a8"></rect>
        <text x="90" y="274" font-size="14" font-weight="600" fill="#854F0B">治理层（核心 · internal/permission）</text>
        <rect x="90" y="290" width="185" height="56" rx="8" fill="#ffffff" stroke="#e8d8b0"></rect>
        <text x="182" y="313" text-anchor="middle" font-size="12.5" fill="#1f2937">① SQL 语法树解析</text>
        <text x="182" y="333" text-anchor="middle" font-size="11.5" fill="#5f5e5a">Vitess sqlparser</text>
        <rect x="295" y="290" width="185" height="56" rx="8" fill="#ffffff" stroke="#e8d8b0"></rect>
        <text x="387" y="313" text-anchor="middle" font-size="12.5" fill="#1f2937">② 表级校验 · 默认拒绝</text>
        <text x="387" y="333" text-anchor="middle" font-size="11.5" fill="#5f5e5a">角色×数据源×表×操作</text>
        <rect x="500" y="290" width="195" height="56" rx="8" fill="#ffffff" stroke="#e8d8b0"></rect>
        <text x="597" y="313" text-anchor="middle" font-size="12.5" fill="#1f2937">③ 行策略注入（派生表）</text>
        <text x="597" y="333" text-anchor="middle" font-size="11.5" fill="#5f5e5a">:attr 代入 · MySQL 别名兼容</text>
        <rect x="715" y="290" width="175" height="56" rx="8" fill="#ffffff" stroke="#e8d8b0"></rect>
        <text x="802" y="313" text-anchor="middle" font-size="12.5" fill="#1f2937">④ 结果层列脱敏</text>
        <text x="802" y="333" text-anchor="middle" font-size="11.5" fill="#5f5e5a">denied / 动态掩码</text>
        <line x1="270" y1="364" x2="270" y2="396" stroke="#94a3b8" stroke-width="2" marker-end="url(#ar)"></line>
        <line x1="700" y1="364" x2="700" y2="396" stroke="#94a3b8" stroke-width="2" marker-end="url(#ar)"></line>
        <!-- 控制面 + 执行层 -->
        <rect x="60" y="400" width="420" height="120" rx="12" fill="#f0fdfa" stroke="#b6e5da"></rect>
        <text x="90" y="430" font-size="14" font-weight="600" fill="#0F6E56">控制面（SQLite · internal/store）</text>
        <text x="90" y="456" font-size="12.5" fill="#2d5c50">用户 / 角色 · 数据源注册 · 表/行/列策略</text>
        <text x="90" y="478" font-size="12.5" fill="#2d5c50">审计日志 audit_logs（ok / denied / error 全留痕）</text>
        <text x="90" y="500" font-size="12.5" fill="#2d5c50">后台管理 UI（内嵌 /admin/，含审计页）</text>
        <rect x="520" y="400" width="400" height="120" rx="12" fill="#ffffff" stroke="#e5e7eb"></rect>
        <text x="550" y="430" font-size="14" font-weight="600" fill="#1f2937">执行层（internal/proxy + datasource）</text>
        <text x="550" y="456" font-size="12.5" fill="#5f5e5a">连接池只持受限服务账号 · 渠道标注 WithChannel</text>
        <text x="550" y="478" font-size="12.5" fill="#5f5e5a">Query / Exec 分流 · 执行后写审计（best-effort）</text>
        <line x1="720" y1="520" x2="720" y2="552" stroke="#94a3b8" stroke-width="2" marker-end="url(#ar)"></line>
        <!-- 真实 DB -->
        <rect x="520" y="556" width="400" height="64" rx="12" fill="#f3f5f8" stroke="#d8dde5"></rect>
        <text x="720" y="582" text-anchor="middle" font-size="13.5" font-weight="600" fill="#1f2937">真实数据库</text>
        <text x="720" y="604" text-anchor="middle" font-size="12" fill="#5f5e5a">MySQL ✅（aegis_svc 受限账号） · SQLite ✅ · PostgreSQL ✅（live 端到端验证）</text>
        <text x="270" y="590" text-anchor="middle" font-size="12" fill="#0F6E56">策略与审计均落控制面，权限聚合供治理层实时取用</text>
      </svg>