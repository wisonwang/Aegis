name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.4'
          cache: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install syft
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | \
            sh -s -- -b /usr/local/bin

      - name: Install Trivy
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'json'
          output: 'dist/aegis-vulns-trivy.json'
          exit-code: '0'

      - name: Verify
        run: make ci-smoke

      - name: Build release archives
        run: ./scripts/build_release_artifacts.sh "${GITHUB_REF_NAME}"

      - name: Generate SBOM
        run: ./scripts/generate_sbom.sh

      - name: Generate checksums
        run: ./scripts/generate_checksums.sh

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign artifacts
        run: |
          cd dist
          for file in aegis_v*.tar.gz aegis-sbom*.json aegis-vulns*.json checksums.txt; do
            if [ -f "$file" ]; then
              cosign sign-blob "$file" --yes --output-signature "$file.sig" --output-certificate "$file.pem"
            fi
          done

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/*.tar.gz
            dist/*.txt
            dist/*.json
            dist/*.sig
            dist/*.pem
