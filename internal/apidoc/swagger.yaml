basePath: /
definitions:
  github_com_wisonwang_aegis_internal_store.MetricParam:
    properties:
      default:
        description: used when omitted and not required
      description:
        description: human/business meaning for agents
        type: string
      enum:
        description: allowed values when type=enum
        items:
          type: string
        type: array
      name:
        description: referenced in SQLTemplate as :name
        type: string
      required:
        description: must be supplied on each run
        type: boolean
      type:
        description: string|number|date|bool|enum
        type: string
    type: object
  internal_api.createApprovalRequest:
    properties:
      datasource_id:
        type: string
      justification:
        type: string
      ops:
        type: string
      role:
        type: string
      table_name:
        type: string
    type: object
  internal_api.createDSRequest:
    properties:
      dsn:
        type: string
      name:
        type: string
      type:
        type: string
      workspace_id:
        description: |-
          WorkspaceID is the owning workspace. Required when the caller is in the
          cross-workspace ("all") view, because there is no sane default there —
          silently falling back to "default" is how governance ends up orphaned.
        type: string
    type: object
  internal_api.createDatasetRequest:
    properties:
      datasource_id:
        type: string
      definition:
        type: string
      description:
        type: string
      display_name:
        type: string
      fields:
        description: optional JSON array of {name,type,description}
        type: string
      name:
        type: string
      status:
        description: 'optional: draft (default) | published'
        type: string
      workspace_id:
        description: |-
          WorkspaceID is the owning workspace. Honored for admins; required when
          creating from the all-workspaces view so a dataset never silently lands in
          "default" (ADR-0007). The datasource lookup stays workspace-agnostic so
          an admin can bind a dataset to any datasource they can see.
        type: string
    type: object
  internal_api.createKeyRequest:
    properties:
      expires_in:
        description: optional duration, e.g. "720h"; empty = no expiry
        type: string
      name:
        type: string
    type: object
  internal_api.createPermRequest:
    properties:
      allowed_cols:
        items:
          type: string
        type: array
      denied_cols:
        items:
          type: string
        type: array
      ops:
        type: string
      role:
        type: string
    type: object
  internal_api.createPolicyRequest:
    properties:
      predicate:
        type: string
      priority:
        type: integer
      role:
        type: string
    type: object
  internal_api.createRoleRequest:
    properties:
      description:
        type: string
      name:
        type: string
    type: object
  internal_api.createUserRequest:
    properties:
      attributes:
        additionalProperties:
          type: string
        type: object
      display_name:
        type: string
      email:
        type: string
      password:
        type: string
      roles:
        items:
          type: string
        type: array
      type:
        description: human | service (default human)
        type: string
      username:
        type: string
      workspace:
        description: 'optional: join the user to this workspace on creation'
        type: string
    type: object
  internal_api.createWorkspaceRequest:
    properties:
      name:
        type: string
      slug:
        type: string
    type: object
  internal_api.datasetQueryRequest:
    properties:
      params:
        items: {}
        type: array
    type: object
  internal_api.estimateRequest:
    properties:
      datasource:
        description: id or name
        type: string
      session_id:
        description: optional; links queries from one AI conversation
        type: string
      sql:
        description: SQL statement to estimate
        type: string
    type: object
  internal_api.loginRequest:
