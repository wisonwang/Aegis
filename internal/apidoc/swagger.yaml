      last_login_at:
        type: string
      roles:
        items:
          type: string
        type: array
      type:
        type: string
      username:
        type: string
    type: object
  internal_api.memberRequest:
    properties:
      role:
        type: string
      user_id:
        type: string
    type: object
  internal_api.nl2sqlRequest:
    properties:
      datasource:
        description: id or name
        type: string
      question:
        description: natural-language question
        type: string
      session_id:
        description: optional; links queries from one AI conversation
        type: string
      sql_hint:
        description: optional hand-written SQL to prefer over generation
        type: string
